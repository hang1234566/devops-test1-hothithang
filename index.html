
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website thực hành DevOps CI/CD với Jenkins, GitHub và Cloudflare Pages">
    <title>DevOps CI/CD Test 1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #101827;
            color: #ffffff;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: 100%;
            max-width: 700px;
            padding: 48px 32px;
            text-align: center;
            background: #182337;
            border: 1px solid #2b3a52;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .label {
            display: inline-block;
            margin-bottom: 18px;
            padding: 8px 14px;
            border-radius: 20px;
            background: #1e3a5f;
            color: #93c5fd;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        h1 {
            margin: 0 0 16px;
            color: #60a5fa;
            font-size: clamp(28px, 5vw, 42px);
        }

        p {
            color: #cbd5e1;
            line-height: 1.7;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-top: 18px;
            padding: 11px 18px;
            border-radius: 30px;
            background: #14532d;
            color: #bbf7d0;
            font-weight: bold;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #4ade80;
        }

        footer {
            margin-top: 30px;
            color: #8290a5;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main>
        <div class="label">DEVOPS PROJECT</div>

        <h1>DevOps CI/CD Test 1</h1>

        <p>
            Website triển khai bằng Jenkins Pipeline,
            quản lý mã nguồn trên GitHub và hosting trên Cloudflare Pages.
        </p>

        <div class="status">
            <span class="dot"></span>
            Website is running!
        </div>

        <footer>
            Automated Build &amp; Deployment
        </footer>
    </main>
</body>
</html>
